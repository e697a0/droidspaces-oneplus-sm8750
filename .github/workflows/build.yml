name: Build Droidspaces Kernel (OnePlus SM8750)

# Builds the LineageOS android_kernel_oneplus_sm8750 kernel with full Droidspaces
# support and packages it as an AnyKernel3 flashable zip.
#
# Nothing is compiled on the caller's machine - everything happens on the runner.

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'LineageOS kernel branch to build'
        required: true
        default: 'lineage-23.2'
        type: choice
        options:
          - lineage-23.2
          - lineage-23.1
          - lineage-23.0
          - lineage-22.2
      profile:
        description: 'Config profile (full = NAT/UFW/Fail2ban/cgroups too)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - core
      localversion:
        description: 'Override kernel release suffix (e.g. -4k-gedc821586bcb). Empty = auto from the branch commit.'
        required: false
        default: ''
      kernel_name:
        description: 'Name shown in the installer'
        required: false
        default: 'Droidspaces Kernel (SM8750 / sun)'
      clang_version:
        description: 'AOSP clang version (must match the kernel tree, see build.config.constants)'
        required: true
        default: 'clang-r510928'
        type: choice
        options:
          - clang-r510928
          - clang-r547379
          - clang-r563880c
          - clang-r584948
      upload_config:
        description: 'Also upload the .config and Image for debugging'
        required: false
        default: true
        type: boolean

  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-droidspaces-sm8750
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # All workflow_dispatch inputs are resolved here, in shell, and exported
      # through $GITHUB_ENV.  This avoids depending on the `inputs` context
      # inside a workflow-level `env:` block (which is not available on every
      # runner version).
      # ------------------------------------------------------------------
      - name: Resolve build parameters
        env:
          IN_BRANCH: ${{ inputs.kernel_branch }}
          IN_PROFILE: ${{ inputs.profile }}
          IN_CLANG: ${{ inputs.clang_version }}
          IN_NAME: ${{ inputs.kernel_name }}
          IN_UPLOAD: ${{ inputs.upload_config }}
        run: |
          set -eu
          BRANCH="${IN_BRANCH:-lineage-23.2}"
          PROFILE="${IN_PROFILE:-full}"
          CLANG_VERSION="${IN_CLANG:-clang-r510928}"
          KERNEL_NAME="${IN_NAME:-Droidspaces Kernel (SM8750 / sun)}"
          UPLOAD_CONFIG="${IN_UPLOAD:-true}"
          REPO_BASE="${{ vars.REPO_BASE }}"
          REPO_BASE="${REPO_BASE:-https://github.com}"

          case "$PROFILE" in
            core|full) ;;
            *) echo "::error::unsupported profile '$PROFILE'"; exit 1 ;;
          esac

          {
            echo "KERNEL_BRANCH=$BRANCH"
            echo "PROFILE=$PROFILE"
            echo "CLANG_VERSION=$CLANG_VERSION"
            echo "KERNEL_NAME=$KERNEL_NAME"
            echo "UPLOAD_CONFIG=$UPLOAD_CONFIG"
            echo "REPO_BASE=$REPO_BASE"
            echo "AK3_NAME=Droidspaces-SM8750-${BRANCH}-${PROFILE}.zip"
          } >> "$GITHUB_ENV"

          {
            echo "### Build parameters"
            echo ""
            echo "| key | value |"
            echo "|---|---|"
            echo "| branch | \`$BRANCH\` |"
            echo "| profile | \`$PROFILE\` |"
            echo "| clang | \`$CLANG_VERSION\` |"
            echo "| source mirror | \`$REPO_BASE\` |"
            echo "| runner | \`$RUNNER_OS/$RUNNER_ARCH\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            zip unzip xz-utils zstd python3 curl git make gcc g++ \
            clang lld ca-certificates patch cpio rsync kmod dwarves \
            device-tree-compiler
          nproc --all
          df -h /

      - name: Fetch kernel sources (kernel + modules + devicetrees)
        run: ./scripts/prepare-sources.sh
        env:
          WORK_DIR: ${{ github.workspace }}/work

      - name: Apply Droidspaces kABI patch
        working-directory: work/src
        run: |
          set -e
          echo "[*] dry-run first (catches upstream drift without touching the tree)"
          patch -p1 --dry-run --batch -f < "$GITHUB_WORKSPACE/patches/001.droidspaces-sysvipc-kabi.patch"
          patch -p1 --batch -f < "$GITHUB_WORKSPACE/patches/001.droidspaces-sysvipc-kabi.patch"
          # Hard guarantee that the ABI-preserving hunk really landed.
          grep -q 'ANDROID_KABI_USE(6, struct sysv_sem sysvsem);' include/linux/sched.h
          grep -q '_ANDROID_KABI_REPLACE(ANDROID_KABI_RESERVE(7); ANDROID_KABI_RESERVE(8), struct sysv_shm sysvshm);' include/linux/sched.h
          echo "[+] kABI patch applied and verified"

      - name: Resolve kernel release string
        run: |
          set -eu
          USER_LV="${{ inputs.localversion }}"
          if [ -n "$USER_LV" ]; then
            LV="$USER_LV"
            echo "[i] using user supplied release suffix: $LV"
          else
            SHA="$(git -C work/src rev-parse HEAD | cut -c1-12)"
            LV="-4k-g${SHA}"
            echo "[i] derived from branch commit: $LV"
          fi
          echo "LOCALVERSION=$LV" >> "$GITHUB_ENV"
          {
            echo ""
            echo "Kernel release suffix: \`$LV\`"
            echo ""
            echo "> This must match the ROM kernel release (`uname -r`) or the stock"
            echo "> vendor_dlkm modules will refuse to load."
          } >> "$GITHUB_STEP_SUMMARY"

      # Configure BEFORE downloading the ~1 GB toolchain, so a config
      # regression fails the run in minutes instead of an hour.
      - name: Configure kernel (merge defconfig + verify, no compile)
        # Uses a throwaway OUT_DIR so the real build starts from a pristine
        # tree, and runs before the ~1 GB toolchain download so that a config
        # regression fails the run in ~5 minutes instead of ~1 hour.
        run: |
          ./scripts/build-kernel.sh
          rm -rf "${{ github.workspace }}/out-validate"
        env:
          KERNEL_DIR: ${{ github.workspace }}/work/src
          OUT_DIR: ${{ github.workspace }}/out-validate
          CONFIGURE_ONLY: '1'

      - name: Install AOSP clang
        run: ./scripts/install-clang.sh
        env:
          CLANG_URL: ${{ vars.CLANG_URL }}

      - name: Build kernel Image
        run: ./scripts/build-kernel.sh
        env:
          KERNEL_DIR: ${{ github.workspace }}/work/src
          OUT_DIR: ${{ github.workspace }}/out

      - name: Package AnyKernel3 zip
        id: package
        run: |
          set -e
          mkdir -p dist
          ./scripts/package-anykernel.sh \
            "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" \
            "$GITHUB_WORKSPACE/dist/$AK3_NAME" \
            "$KERNEL_NAME"
          ls -l dist/
          unzip -l "dist/$AK3_NAME" > dist/zip-contents.txt || true
          {
            echo "ak3=$AK3_NAME" >> "$GITHUB_OUTPUT"
            echo "img_sha256=$(sha256sum out/arch/arm64/boot/Image | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "zip_sha256=$(sha256sum "dist/$AK3_NAME" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          }

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ak3 }}
          path: dist/${{ steps.package.outputs.ak3 }}
          if-no-files-found: error
          compression-level: 0

      - name: Upload Image, .config and zip listing
        if: env.UPLOAD_CONFIG != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-and-config
          path: |
            out/arch/arm64/boot/Image
            out/.config
            dist/zip-contents.txt
          if-no-files-found: warn
          compression-level: 0

      - name: Summary
        if: always()
        run: |
          {
            echo ""
            echo "### Result"
            echo ""
            echo "| artifact | sha256 |"
            echo "|---|---|"
            echo "| kernel Image | \`${{ steps.package.outputs.img_sha256 }}\` |"
            echo "| $AK3_NAME | \`${{ steps.package.outputs.zip_sha256 }}\` |"
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Create release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/$AK3_NAME" \
            --title "${{ github.ref_name }}" \
            --notes "Droidspaces kernel for OnePlus SM8750 (sun)

          * branch: $KERNEL_BRANCH
          * profile: $PROFILE
          * release suffix: $LOCALVERSION
          * clang: $CLANG_VERSION
          * kernel Image sha256: ${{ steps.package.outputs.img_sha256 }}" \
            || true
